
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - The Party</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>The Party Detective</h1>
        <p>Birthday Party | 19:30 - 22:30</p>
    </header>

    <main>
        <section class="controls">
            <h2>Selector Detective</h2>
            <div id="caseButtons"></div>
            <button id="clearButton">Clear</button>
        </section>

        <section id="house">
            <h2>Floor 2</h2>
            <div class="floor">
                <div class="room" id="balcony">
                    <h3>Balcony</h3>
                    <div class="guests"></div>
                    <button class="sortButton">Sort by time</button>
                </div>

                <div class="room" id="hall">
                    <h3>Hall</h3>
                    <div class="guests"></div>
                    <button class="sortButton">Sort by time</button>
                </div>
            </div>

            <h2>Floor 1</h2>
            <div class="floor">
                <div class="room" id="kitchen">
                    <h3>Kitchen</h3>
                    <div class="guests"></div>
                    <button class="sortButton">Sort by time</button>
                </div>

                <div class="room" id="living">
                    <h3>Living Room</h3>
                    <div class="guests"></div>
                    <button class="sortButton">Sort by time</button>
                </div>
            </div>
        </section>

        <section id="result">
            <h2>Investigation Result</h2>
            <p>Choose a case to find the guests.</p>
        </section>
    </main>

    <div id="guestModal" class="modal">
        <div class="modal-content"></div>
    </div>

</body>
</html>
